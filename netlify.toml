[build]
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Keep Node-only dependencies in the function ZIP, including transitive files.
  external_node_modules = ["@neondatabase/serverless", "ws", "https-proxy-agent", "@aws-sdk/client-s3", "@smithy/node-http-handler"]
  # The mixed ESM/CommonJS graph can escape dependency tracing. Include installed
  # production packages explicitly rather than relying only on tracing.
  included_files = ["node_modules/**"]

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
[[redirects]]
  from = "/club"
  to = "/club.html"
  status = 200
[[redirects]]
  from = "/setup"
  to = "/setup.html"
  status = 200
[[redirects]]
  from = "/budget"
  to = "/budget.html"
  status = 200
[[redirects]]
  from = "/product"
  to = "/product.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[redirects]]
  from = "/shop"
  to = "/budget.html"
  status = 200
[[redirects]]
  from = "/value"
  to = "/budget.html"
  status = 200
