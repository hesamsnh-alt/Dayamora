[build]
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Keep Node-only dependencies in the function ZIP, including transitive files.
  external_node_modules = ["@neondatabase/serverless", "ws", "https-proxy-agent", "@aws-sdk/client-s3", "@smithy/node-http-handler"]
  # The mixed ESM/CommonJS graph can escape dependency tracing. Include installed
  # production packages explicitly rather than relying only on tracing.
  included_files = ["node_modules/**"]

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
[[redirects]]
  from = "/club"
  to = "/club.html"
  status = 200
[[redirects]]
  from = "/setup"
  to = "/setup.html"
  status = 200
[[redirects]]
  from = "/budget"
  to = "/budget.html"
  status = 200
[[redirects]]
  from = "/product"
  to = "/product.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "same-origin"
    # Document-specific policies live in each HTML head; they remain restrictive.
    Content-Security-Policy = "frame-ancestors 'none'"

[[redirects]]
  from = "/shop"
  to = "/budget.html"
  status = 200
[[redirects]]
  from = "/value"
  to = "/budget.html"
  status = 200

[[redirects]]
  from = "/discover/*"
  to = "/discover.html"
  status = 200

[[headers]]
  for = "/garment-worker.js"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' https://huggingface.co https://*.hf.co https://*.huggingface.co; frame-ancestors 'none'"
